name: Release APK

on:
  push:
    tags: ["v*"]          # ex.: git tag v1.0 && git push --tags
  workflow_dispatch:      # também dá para rodar manualmente (só gera o APK como artefato)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão a partir da tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0-dev"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Restaurar keystore dos Secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/dharma.keystore"

      - name: Compilar APK
        working-directory: android
        env:
          DHARMA_KEYSTORE_FILE: ${{ runner.temp }}/dharma.keystore
          DHARMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Dharma-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Dharma-apk
          path: Dharma-*.apk

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Dharma-*.apk
          generate_release_notes: true
